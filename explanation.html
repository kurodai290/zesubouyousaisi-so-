        <body>
            <h1>5thステージの説明をします</h1>
            <p>このステージでは、シーソーを使いボールをゴールまで運ぶステージです</p>
            <h2>注意</h2>
            <p>ボールの残機は３つです。</p>
            <p>ステージは５つあります</p>
            <p>すべての残機がなくなってしまった場合、ゲームオーバーになります</p>
